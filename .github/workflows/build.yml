name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas a un commit exacto (no a una etiqueta que alguien pueda mover).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14.3"

      - name: Preparar firma (desde los secretos del repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rutina.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/rutina.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log

      - name: Resumir errores
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Caused by|error:" -A2 build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l}"
          done

      - name: Borrar firma temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/rutina.jks"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Rutina-v${{ github.run_number }}.apk

      # Descargable desde el celular: pestaña "Releases" del repo
      - name: Publicar en Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ github.run_number }}
          name: Rutina v${{ github.run_number }}
          body: "Compilación automática de ${{ github.sha }}. Instala el APK encima de la versión anterior; tus datos se conservan."
          files: Rutina-v${{ github.run_number }}.apk
